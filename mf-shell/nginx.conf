server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # index.html no se cachea para que siempre apunte a los archivos (con hash) más recientes
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas de React Router (ej. /character/1) → index.html; React decide qué mostrar
  location / {
    try_files $uri $uri/ /index.html;
  }
}

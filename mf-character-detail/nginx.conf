server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # remoteEntry.js es el "índice" del MF: nunca se cachea para que el Shell siempre reciba la última versión.
  # (En nginx, un add_header dentro de location reemplaza los del server, por eso se repite el CORS.)
  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "no-cache";
  }

  # El resto de archivos (con hash en el nombre) y las rutas de React Router → index.html
  location / {
    add_header Access-Control-Allow-Origin *;
    try_files $uri $uri/ /index.html;
  }
}
